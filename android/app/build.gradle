plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.dictapro.app"
    compileSdk 35
    ndkVersion flutter.ndkVersion

    // Install-time asset pack с моделью GigaAM v3 (task 019).
    // Только для AAB (Play). В APK asset packs игнорируются —
    // модель тогда идёт через flutter-ассеты (tools/prepare_apk_build.py).
    assetPacks = [":gigaam_pack"]

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.dictapro.app"
        minSdkVersion flutter.minSdkVersion
        targetSdk 35
        versionCode 51
        versionName "1.51"
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Play Asset Delivery — чтение install-time asset pack (модель GigaAM, task 019)
    implementation 'com.google.android.play:asset-delivery:2.3.0'
}
