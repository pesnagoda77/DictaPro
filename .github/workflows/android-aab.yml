name: Android AAB (сборка + Play)

# Ручной запуск: сборка подписанного AAB и выгрузка в Google Play.
# Секреты: CODE_KEY, DICTA_APP_KEY, GH_MODULE_TOKEN (уже есть),
# ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS,
# PLAY_JSON_KEY_BASE64.
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'internal / alpha / beta / production'
        required: false
        default: 'internal'
      notes:
        description: 'Release notes (ru, кратко)'
        required: false
        default: ''

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Доступ к приватному модулю кодов
        run: git config --global url."https://x-access-token:${{ secrets.GH_MODULE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Зависимости
        run: flutter pub get

      - name: Модели (GigaAM v3 + Whisper)
        run: python3 tools/fetch_model.py

      - name: Подпись (keystore + key.properties)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/app/key.properties <<EOF
          storePassword=$KS_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          ls -la android/app/upload-keystore.jks

      - name: Сборка AAB
        run: >-
          flutter build appbundle --release
          --dart-define=CODE_KEY=${{ secrets.CODE_KEY }}
          --dart-define=DICTA_APP_KEY=${{ secrets.DICTA_APP_KEY }}
          --dart-define=BILLING_API_URL=https://billing-api.pesnagoda77.workers.dev

      - name: Выгрузка в Play
        env:
          PLAY_JSON_PATH: /tmp/play.json
          AAB_PATH: build/app/outputs/bundle/release/app-release.aab
          TRACK: ${{ inputs.track }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          echo "${{ secrets.PLAY_JSON_KEY_BASE64 }}" | base64 --decode > /tmp/play.json
          python3 tools/ci_play_publish.py

      - name: Сохранить AAB как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dicta-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 14
