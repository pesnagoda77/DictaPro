name: iOS build check

# Проверка iOS-сборки на macOS. Запускается ВРУЧНУЮ (кнопка Run workflow),
# чтобы не присылать письма о падениях при каждом изменении кода.
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Версия Flutter
        run: flutter --version
      - name: Зависимости
        run: flutter pub get

      - name: Модель распознавания (GigaAM v3)
        run: python3 tools/fetch_model.py

      - name: Диагностика версий
        run: |
          flutter --version
          echo "--- Podfile ---"
          cat ios/Podfile | grep -n "platform" || true
          echo "--- целевые версии в проекте ---"
          grep -o "IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*" ios/Runner.xcodeproj/project.pbxproj | sort -u || true
          echo "--- требование Flutter-пода ---"
          find . -name "Flutter.podspec" 2>/dev/null | head -3
          for f in $(find . -name "Flutter.podspec" 2>/dev/null | head -3); do echo "== $f"; grep -n "platform\|deployment" $f || true; done
          echo "--- версия Flutter ---"
          flutter --version --machine | head -20

      - name: Установка модулей iOS
        run: cd ios && pod install --repo-update
      - name: Сборка iOS без подписи
        run: flutter build ios --release --no-codesign
