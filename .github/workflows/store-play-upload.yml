name: store-play-upload

on:
  workflow_dispatch:
    inputs:
      aab_url:
        description: 'URL AAB (GitHub asset). Пусто = собрать AAB из репозитория'
        required: false
        default: ''
      track:
        description: 'internal / alpha / beta / production'
        required: false
        default: 'internal'
      notes:
        description: 'Release notes (кратко)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Скачать готовый AAB
        if: inputs.aab_url != ''
        run: |
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/octet-stream" \
            -o /tmp/app.aab "${{ inputs.aab_url }}"
          ls -la /tmp/app.aab

      - name: Java 17 (для сборки)
        if: inputs.aab_url == ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter (для сборки)
        if: inputs.aab_url == ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Доступ к приватному модулю кодов
        if: inputs.aab_url == ''
        run: git config --global url."https://x-access-token:${{ secrets.GH_MODULE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Зависимости
        if: inputs.aab_url == ''
        run: flutter pub get

      - name: Модели (GigaAM v3 + Whisper)
        if: inputs.aab_url == ''
        run: python3 tools/fetch_model.py

      - name: Патч permission_handler (устаревший Registrar)
        if: inputs.aab_url == ''
        run: python3 tools/patch_permission_handler.py

      - name: Подпись (keystore)
        if: inputs.aab_url == ''
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$KS_PASS" "$KEY_PASS" "$KEY_ALIAS" > android/app/key.properties

      - name: Сборка AAB
        if: inputs.aab_url == ''
        run: >-
          flutter build appbundle --release
          --dart-define=CODE_KEY=${{ secrets.CODE_KEY }}
          --dart-define=DICTA_APP_KEY=${{ secrets.DICTA_APP_KEY }}
          --dart-define=BILLING_API_URL=https://billing-api.pesnagoda77.workers.dev

      - name: Подготовить AAB
        if: inputs.aab_url == ''
        run: |
          mkdir -p /tmp
          cp build/app/outputs/bundle/release/app-release.aab /tmp/app.aab
          ls -la /tmp/app.aab

      - name: Зависимости скрипта
        run: pip install cryptography

      - name: Play ключ
        env:
          PLAY_JSON_B64: ${{ secrets.PLAY_JSON_KEY_BASE64 }}
        run: |
          echo "$PLAY_JSON_B64" | base64 --decode > /tmp/play.json

      - name: Публикация
        env:
          PLAY_JSON_PATH: /tmp/play.json
          AAB_PATH: /tmp/app.aab
          TRACK: ${{ inputs.track }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: python3 tools/ci_play_publish.py

      - name: Сохранить AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ github.run_number }}
          path: /tmp/app.aab
          if-no-files-found: warn
          retention-days: 14
