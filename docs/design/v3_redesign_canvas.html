<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДиктаПро — бесконечный холст V1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#10161d;--bg-subtle:#161e27;--surface:#1b242f;--surface-raised:#212c39;
    --border:rgba(255,255,255,.07);--border-hover:rgba(255,255,255,.14);
    --accent:#8FE3D2;--accent-dim:rgba(143,227,210,.15);
    --text:#EAF2F5;--text-secondary:rgba(234,242,245,.66);--text-tertiary:rgba(234,242,245,.40);
    --shadow-sm:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 4px 16px rgba(0,0,0,.35);--shadow-lg:0 12px 40px rgba(0,0,0,.45);
    --shadow-drag:0 20px 60px rgba(0,0,0,.5),0 0 0 1.5px var(--accent);
    --radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:22px;
    --font-sans:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:"JetBrains Mono",monospace;
    --note-bg:#232a24;--note-border:rgba(143,227,210,.22);
    --t-fast:120ms cubic-bezier(.25,.1,.25,1);--t:200ms cubic-bezier(.25,.1,.25,1);
    /* --- токены приложения (из DESIGN_SYSTEM.md) --- */
    --d-bg0:#111A24;--d-bg1:#182532;--d-bg2:#1F2E3D;
    --d-surf:rgba(255,255,255,.055);--d-surf2:rgba(255,255,255,.03);
    --d-line:rgba(255,255,255,.09);--d-line2:rgba(255,255,255,.16);
    --d-ink:#EAF2F5;--d-ink2:rgba(234,242,245,.66);--d-ink3:rgba(234,242,245,.42);
    --d-mint:#8FE3D2;--d-mint2:#4FB3A5;--d-red:#FF6B6B;--d-gold:#FFD166;
    --d-r:14px;
  }
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-sans);
    user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
  body::after{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:.035;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size:512px 512px}
  .canvas-viewport{position:fixed;inset:0;overflow:hidden;cursor:grab;--grid-color:rgba(255,255,255,.04)}
  .canvas-viewport.panning{cursor:grabbing}
  .canvas-world{position:absolute;left:0;top:0;width:26000px;height:16000px;transform-origin:0 0;will-change:transform}
  .canvas-el{position:absolute;cursor:grab;transition:box-shadow var(--t),transform var(--t-fast)}
  .canvas-el:hover{z-index:10}
  .canvas-el.dragging{cursor:grabbing;z-index:999;box-shadow:var(--shadow-drag)!important;transform:scale(1.01);transition:none}
  .section-header{position:absolute;pointer-events:none;display:flex;align-items:center;gap:16px;white-space:nowrap}
  .section-header .section-num{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--accent);opacity:.8}
  .section-header .section-label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-tertiary)}
  .section-header .section-line{flex:none;width:48px;height:1px;background:linear-gradient(90deg,var(--accent),transparent);opacity:.3}
  .canvas-title{position:absolute;pointer-events:none;font-weight:700;line-height:1.1;letter-spacing:-.025em;color:var(--text)}
  .canvas-text{position:absolute;line-height:1.7;color:var(--text-secondary);min-width:200px;max-width:600px;white-space:pre-wrap;word-break:break-word}
  .canvas-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:100px;font-size:12px;font-weight:500;
    color:var(--text-secondary);background:var(--surface);border:1px solid var(--border);white-space:nowrap}
  .canvas-tag .tag-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0}
  .context-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden;min-width:220px}
  .context-card .card-head{padding:16px 20px 10px;display:flex;align-items:center;gap:10px}
  .context-card .card-head .head-indicator{width:3px;height:16px;border-radius:2px;background:var(--accent)}
  .context-card .card-head h3{font-size:13px;font-weight:600}
  .context-card .card-content{padding:0 20px 20px;font-size:12.5px;line-height:1.7;color:var(--text-secondary)}
  .context-card .card-content ul{list-style:none}
  .context-card .card-content li{padding:4px 0 4px 12px;position:relative}
  .context-card .card-content li::before{content:'';position:absolute;left:0;top:11px;width:4px;height:4px;border-radius:50%;background:var(--text-tertiary)}
  .ds-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden}
  .ds-card .ds-head{padding:16px 20px 12px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-tertiary)}
  .ds-card .ds-body{padding:0 20px 20px}
  .color-swatch-group{display:flex;flex-wrap:wrap;gap:18px}
  .swatch-item{display:flex;flex-direction:column;align-items:center;gap:8px}
  .swatch-circle{width:52px;height:52px;border-radius:50%;box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,.08)}
  .swatch-name{font-size:10px;color:var(--text-secondary);text-align:center}
  .swatch-hex{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary)}
  .canvas-note{background:var(--note-bg);border:1px solid var(--note-border);border-radius:var(--radius-md);padding:16px 18px;min-width:200px;max-width:320px;box-shadow:var(--shadow-sm)}
  .canvas-note .note-tag{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);opacity:.75;margin-bottom:8px}
  .canvas-note .note-body{font-size:12.5px;line-height:1.65;color:var(--text-secondary)}
  .design-page{background:#000;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-lg)}
  .design-page .page-content{width:100%;height:100%;overflow:hidden}
  .page-label{position:absolute;bottom:-30px;left:0;font-size:11px;font-weight:500;color:var(--text-tertiary);white-space:nowrap;display:flex;align-items:center;gap:8px}
  .page-label .label-num{font-family:var(--font-mono);font-size:10px;color:var(--accent);opacity:.6}
  .canvas-diagram{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
  .canvas-diagram .diagram-content{width:100%;height:100%;padding:20px}
  .zoom-controls{position:fixed;bottom:24px;right:24px;display:flex;align-items:center;gap:1px;z-index:100;background:var(--bg-subtle);
    border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-md)}
  .zoom-btn{width:36px;height:36px;background:transparent;border:none;color:var(--text-secondary);font-size:15px;cursor:pointer}
  .zoom-btn:hover{background:rgba(255,255,255,.06);color:var(--text)}
  .zoom-label{min-width:52px;height:36px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);border-left:1px solid var(--border);border-right:1px solid var(--border)}
  .coord-indicator{position:fixed;bottom:28px;left:24px;font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);z-index:100;
    padding:4px 10px;background:rgba(16,22,29,.85);border:1px solid var(--border);border-radius:var(--radius-sm)}
  .kbd-hint{position:fixed;top:20px;right:24px;z-index:100;font-size:10px;color:var(--text-tertiary);display:flex;gap:12px;opacity:0;transition:opacity .4s;pointer-events:none}
  .canvas-viewport:hover~.kbd-hint{opacity:1}
  .kbd-hint kbd{font-family:var(--font-mono);padding:2px 6px;background:var(--surface);border:1px solid var(--border);border-radius:4px;font-size:10px}

  /* ══════════════ ЭКРАНЫ ПРИЛОЖЕНИЯ (Row 3) ══════════════ */
  .scr{width:390px;height:844px;position:relative;overflow:hidden;font-family:var(--font-sans);color:var(--d-ink);
    background:radial-gradient(120% 60% at 50% -10%,rgba(143,227,210,.13),transparent 60%),
               radial-gradient(90% 50% at 110% 112%,rgba(255,107,107,.10),transparent 60%),
               linear-gradient(180deg,var(--d-bg1),var(--d-bg0))}
  .scr.light{background:radial-gradient(120% 60% at 50% -10%,rgba(79,179,165,.12),transparent 60%),linear-gradient(180deg,#F4F7F9,#E6EDF2);color:#16222E}
  .scr::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.05;
    background-image:radial-gradient(rgba(255,255,255,.9) .5px,transparent .5px);background-size:3px 3px}
  .sc{padding:14px 16px 16px;position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
  .sbar{display:flex;justify-content:space-between;font-size:10.5px;color:var(--d-ink3);font-family:var(--font-mono);margin-bottom:12px}
  .hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(160deg,var(--d-mint),var(--d-mint2));display:flex;align-items:center;justify-content:center;flex:none}
  .mark svg{width:18px;height:18px}
  .brand{font-weight:700;font-size:15.5px;line-height:1.15}
  .brand span{display:block;font-weight:500;font-size:10.5px;color:var(--d-mint);margin-top:2px}
  .hd .r{margin-left:auto;display:flex;align-items:center;gap:9px;color:var(--d-ink3)}
  .icn{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .air{border:1px solid var(--d-line);border-radius:99px;padding:3px 9px;font-size:10px;color:var(--d-ink2);white-space:nowrap}
  .ttl{font-size:20px;font-weight:800;line-height:1.22;margin-bottom:6px}
  .ttl em{font-style:normal;color:var(--d-mint)}
  .lead{font-size:12.5px;color:var(--d-ink2);line-height:1.5;margin-bottom:12px}
  .search{display:flex;gap:8px;align-items:center;background:var(--d-surf);border:1px solid var(--d-line);border-radius:10px;padding:10px 11px;font-size:12.5px;color:var(--d-ink3);margin-bottom:11px}
  .hero{border-radius:20px;padding:15px;text-align:center;margin-bottom:12px;
    background:linear-gradient(180deg,rgba(143,227,210,.10),rgba(143,227,210,.02));border:1px solid rgba(143,227,210,.22)}
  .hero .cap2{font-size:11.5px;color:var(--d-ink2);margin-bottom:11px}
  .mic{width:86px;height:86px;border-radius:50%;margin:0 auto;background:linear-gradient(180deg,#FF7E7E,var(--d-red));
    display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px rgba(255,107,107,.32)}
  .mono{font-family:var(--font-mono)}
  .timer{font-size:25px;font-weight:700;letter-spacing:1px;margin-top:11px}
  .recstate{font-size:12px;color:var(--d-mint);font-weight:600;margin-top:3px}
  .chips{display:flex;gap:7px;margin-bottom:11px}
  .chip{font-size:12px;padding:6px 11px;border-radius:99px;border:1px solid var(--d-line);color:var(--d-ink2);white-space:nowrap}
  .chip.on{background:var(--d-mint);color:#0E2A26;border-color:var(--d-mint);font-weight:700}
  .sec{display:flex;align-items:baseline;margin:2px 0 8px}
  .sec b{font-size:13px;font-weight:700}
  .sec span{margin-left:auto;font-size:11.5px;color:var(--d-mint)}
  .item{border:1px solid var(--d-line);border-radius:var(--d-req,14px);padding:12px;margin-bottom:9px;
    background:linear-gradient(180deg,var(--d-surf),var(--d-surf2))}
  .item.lead1{border-color:rgba(143,227,210,.24);background:linear-gradient(180deg,rgba(143,227,210,.08),rgba(143,227,210,.02))}
  .ihead{display:flex;gap:10px;align-items:center}
  .ibox{width:34px;height:34px;border-radius:10px;background:rgba(143,227,210,.13);border:1px solid rgba(143,227,210,.24);display:flex;align-items:center;justify-content:center;flex:none}
  .ibox svg{width:15px;height:15px;stroke:var(--d-mint);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .name{font-size:13.5px;font-weight:700}
  .sub{font-size:11px;color:var(--d-ink3);margin-top:2px}
  .tag{display:inline-block;margin-top:6px;font-size:10px;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--d-mint);color:#0E2A26}
  .tag.g{background:rgba(255,255,255,.12);color:var(--d-ink2);font-weight:600}
  .tag.r{background:rgba(255,107,107,.18);color:#FFB3B3}
  .tag.gold{background:rgba(255,209,102,.18);color:var(--d-gold)}
  .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:11px}
  .act{border:1px solid var(--d-line);border-radius:11px;padding:9px 4px;text-align:center;font-size:10px;color:var(--d-ink2);background:rgba(255,255,255,.03)}
  .act b{display:block;font-weight:600;font-size:11px;color:var(--d-ink);margin-bottom:3px}
  .act.off{opacity:.45}
  .cta{background:linear-gradient(180deg,#FF7E7E,var(--d-red));border-radius:14px;text-align:center;padding:13px;font-weight:800;font-size:14.5px;color:#2A0E0E;box-shadow:0 12px 26px rgba(255,107,107,.25)}
  .cta small{display:block;font-weight:600;font-size:11px;opacity:.9;margin-top:2px}
  .btn{border:1px solid var(--d-line2);border-radius:12px;text-align:center;padding:12px;font-weight:700;font-size:13.5px;color:var(--d-ink)}
  .btn.mint{background:var(--d-mint);color:#0E2A26;border-color:var(--d-mint)}
  .btn.ghost{color:var(--d-ink2)}
  .links{display:flex;justify-content:space-between;margin-top:11px;font-size:12px;color:var(--d-ink2)}
  .links u{color:var(--d-mint);text-decoration:none;border-bottom:1px dashed rgba(143,227,210,.45)}
  .nav{display:flex;margin-top:auto;padding-top:10px;border-top:1px solid var(--d-line);font-size:10.5px;color:var(--d-ink3)}
  .nav div{flex:1;text-align:center}
  .nav .on{color:var(--d-mint);font-weight:700}
  .foot{margin-top:10px;padding-top:10px;border-top:1px solid var(--d-line);font-size:10.5px;color:var(--d-ink3);line-height:1.5}
  .foot b{color:var(--d-ink2)}
  .prog{border:1px solid rgba(143,227,210,.24);background:rgba(143,227,210,.07);border-radius:14px;padding:11px;margin-bottom:9px}
  .bar{height:5px;border-radius:99px;background:rgba(255,255,255,.10);margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--d-mint2),var(--d-mint));border-radius:99px}
  .seg{border-left:2px solid rgba(143,227,210,.35);padding:0 0 0 10px;margin-bottom:11px}
  .who{font-size:10.5px;color:var(--d-mint);font-weight:700;letter-spacing:.3px}
  .txt{font-size:12.5px;line-height:1.5;margin-top:3px}
  .toolrow{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
  .tool{border:1px solid var(--d-line);border-radius:10px;padding:8px 10px;font-size:11px;color:var(--d-ink2)}
  .blk{border:1px solid var(--d-line);border-radius:14px;padding:12px;margin-bottom:9px;background:linear-gradient(180deg,var(--d-surf),var(--d-surf2))}
  .blk h4{margin:0 0 7px;font-size:12px;font-weight:700;color:var(--d-mint);letter-spacing:.2px}
  .li{display:flex;gap:8px;font-size:12px;line-height:1.5;color:var(--d-ink2);margin-bottom:5px}
  .li b{color:var(--d-ink);font-weight:600}
  .box{width:13px;height:13px;border-radius:4px;border:1.5px solid var(--d-mint);margin-top:2px;flex:none}
  .box.on{background:var(--d-mint);border-color:var(--d-mint)}
  .toggle{display:flex;background:var(--d-bg2);border:1px solid var(--d-line);border-radius:12px;padding:4px;margin-bottom:12px}
  .toggle div{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-size:13px;font-weight:600;color:var(--d-ink3)}
  .toggle .on{background:var(--d-mint);color:#0E2A26}
  .toggle .on small{display:block;font-weight:700;font-size:10.5px;opacity:.85}
  .card{position:relative;border:1px solid var(--d-line);border-radius:14px;padding:13px;margin-bottom:10px;background:linear-gradient(180deg,var(--d-surf),var(--d-surf2))}
  .card.best{border-color:var(--d-gold);background:linear-gradient(180deg,rgba(255,209,102,.13),rgba(255,209,102,.03))}
  .card.cur{border-color:rgba(143,227,210,.45)}
  .badge{position:absolute;top:-9px;right:11px;background:var(--d-gold);color:#3A2C00;font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px}
  .crow{display:flex;align-items:baseline;gap:9px}
  .tier{font-size:15.5px;font-weight:800}
  .tier small{display:block;font-weight:500;font-size:10.5px;color:var(--d-ink3);margin-top:2px}
  .price{margin-left:auto;text-align:right}
  .price b{font-size:20px}
  .price s{display:block;color:var(--d-ink3);font-size:10.5px;text-decoration:none}
  .vol{margin-top:9px;font-size:13px;font-weight:600}
  .bonus{margin-top:4px;font-size:12px;font-weight:700;color:var(--d-mint)}
  .rowl{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--d-line)}
  .rowl .k{font-size:12.5px;font-weight:600}
  .rowl .v{margin-left:auto;font-size:12px;color:var(--d-ink3)}
  .rowl .v.mono{font-family:var(--font-mono)}
  .grp{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--d-mint);margin:14px 0 2px}
  .sw{width:38px;height:22px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;flex:none;margin-left:auto}
  .sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;display:block}
  .sw.on{background:var(--d-mint)}
  .sw.on i{left:18px}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#1C2A38,#141E29);border-radius:22px 22px 0 0;
    border-top:1px solid var(--d-line2);padding:14px 16px 18px;box-shadow:0 -18px 40px rgba(0,0,0,.5);z-index:5}
  .grab{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.22);margin:0 auto 12px}
  .dim{position:absolute;inset:0;background:rgba(6,10,15,.55);z-index:4}
  .packs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pack{border:1px solid var(--d-line);border-radius:12px;padding:10px;background:rgba(255,255,255,.03)}
  .pack b{display:block;font-size:13px;font-weight:700}
  .pack .p{font-family:var(--font-mono);font-size:12.5px;color:var(--d-mint);margin-top:3px}
  .wave{display:flex;align-items:center;gap:3px;height:64px;margin:6px 0 14px}
  .wave i{flex:1;background:linear-gradient(180deg,var(--d-mint),var(--d-mint2));border-radius:99px;opacity:.85}
  .pf{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 14px;color:var(--d-ink)}
  .pbtn{width:64px;height:64px;border-radius:50%;background:linear-gradient(180deg,#FF7E7E,var(--d-red));display:flex;align-items:center;justify-content:center;box-shadow:0 12px 26px rgba(255,107,107,.28)}
  .pbtn svg{width:24px;height:24px;fill:#2A0E0E;stroke:none}
  .pmini{width:44px;height:44px;border-radius:50%;border:1px solid var(--d-line2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  .cnt{text-align:center;padding:40px 0}
  .cnt .big{font-size:19px;font-weight:800;margin-bottom:6px}
  .cnt .sm{font-size:12.5px;color:var(--d-ink2);line-height:1.55;margin-bottom:16px}
  .lvl{display:flex;align-items:center;justify-content:center;gap:3px;height:26px;margin-top:10px}
  .lvl i{width:4px;background:var(--d-mint);border-radius:2px;opacity:.8}

<body>
<div class="canvas-viewport" id="viewport"><div class="canvas-world" id="world"></div></div>
<div class="zoom-controls">
  <button class="zoom-btn" id="zoomOut" aria-label="Уменьшить">&#8722;</button>
  <div class="zoom-label" id="zoomLabel">100%</div>
  <button class="zoom-btn" id="zoomIn" aria-label="Увеличить">+</button>
  <button class="zoom-btn" id="zoomReset" aria-label="Сбросить вид">&#8962;</button>
</div>
<div class="coord-indicator" id="coordIndicator">0, 0</div>
<div class="kbd-hint" id="kbdHint"></div>
<script>
(() => {
  document.title = "ДиктаПро — бесконечный холст V1";
  document.getElementById('kbdHint').innerHTML =
    [["Прокрутка","перемещение"],["Ctrl+прокрутка","масштаб"],["Ctrl+Z","отменить"]]
      .map(([k,a])=>`<span><kbd>${k}</kbd> ${a}</span>`).join('');

  const viewport=document.getElementById('viewport'),world=document.getElementById('world'),
        zoomLabel=document.getElementById('zoomLabel'),coordIndicator=document.getElementById('coordIndicator');
  let panX=0,panY=0,zoom=1;const MIN_ZOOM=.05,MAX_ZOOM=8;
  function updateTransform(){world.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;zoomLabel.textContent=Math.round(zoom*100)+'%';updateGrid();}
  function updateGrid(){const g=40*zoom;viewport.style.backgroundImage=`radial-gradient(circle, var(--grid-color) .8px, transparent .8px)`;viewport.style.backgroundSize=`${g}px ${g}px`;viewport.style.backgroundPosition=`${panX%g}px ${panY%g}px`;}
  let isPanning=false,panSX,panSY;
  viewport.addEventListener('pointerdown',e=>{if(e.target===viewport||e.target===world){isPanning=true;panSX=e.clientX-panX;panSY=e.clientY-panY;viewport.classList.add('panning');viewport.setPointerCapture(e.pointerId);e.preventDefault();}});
  viewport.addEventListener('pointermove',e=>{if(!isPanning)return;panX=e.clientX-panSX;panY=e.clientY-panSY;updateTransform();});
  viewport.addEventListener('pointerup',()=>{isPanning=false;viewport.classList.remove('panning');});
  viewport.addEventListener('wheel',e=>{e.preventDefault();const rect=viewport.getBoundingClientRect();
    if(e.ctrlKey||e.metaKey){const mx=e.clientX-rect.left,my=e.clientY-rect.top,wx=(mx-panX)/zoom,wy=(my-panY)/zoom;
      zoom=Math.min(MAX_ZOOM,Math.max(MIN_ZOOM,zoom*(e.deltaY>0?.95:1.05)));panX=mx-wx*zoom;panY=my-wy*zoom;}
    else{if(Math.abs(e.deltaX)>Math.abs(e.deltaY)*.3){panX-=e.deltaX;panY-=e.deltaY;}
      else{const mx=e.clientX-rect.left,my=e.clientY-rect.top,wx=(mx-panX)/zoom,wy=(my-panY)/zoom;
        zoom=Math.min(MAX_ZOOM,Math.max(MIN_ZOOM,zoom*(e.deltaY>0?.95:1.05)));panX=mx-wx*zoom;panY=my-wy*zoom;}}
    updateTransform();},{passive:false});
  function zoomAt(f){const r=viewport.getBoundingClientRect(),cx=r.width/2,cy=r.height/2,wx=(cx-panX)/zoom,wy=(cy-panY)/zoom;
    zoom=Math.min(MAX_ZOOM,Math.max(MIN_ZOOM,zoom*f));panX=cx-wx*zoom;panY=cy-wy*zoom;updateTransform();}
  document.getElementById('zoomIn').onclick=()=>zoomAt(1.25);
  document.getElementById('zoomOut').onclick=()=>zoomAt(.8);
  document.getElementById('zoomReset').onclick=()=>{zoom=1;panX=0;panY=0;updateTransform();};
  viewport.addEventListener('pointermove',e=>{if(isPanning)return;const r=viewport.getBoundingClientRect();
    coordIndicator.textContent=`${Math.round((e.clientX-r.left-panX)/zoom)}, ${Math.round((e.clientY-r.top-panY)/zoom)}`;});
  let lastPinchDist=null,lastPinchCenter=null;
  viewport.addEventListener('touchstart',e=>{if(e.touches.length===2){const t0=e.touches[0],t1=e.touches[1];
    lastPinchDist=Math.hypot(t1.clientX-t0.clientX,t1.clientY-t0.clientY);
    lastPinchCenter={x:(t0.clientX+t1.clientX)/2,y:(t0.clientY+t1.clientY)/2};e.preventDefault();}},{passive:false});
  viewport.addEventListener('touchmove',e=>{if(e.touches.length!==2)return;e.preventDefault();const t0=e.touches[0],t1=e.touches[1];
    const dist=Math.hypot(t1.clientX-t0.clientX,t1.clientY-t0.clientY),center={x:(t0.clientX+t1.clientX)/2,y:(t0.clientY+t1.clientY)/2};
    if(lastPinchDist>0){const r=viewport.getBoundingClientRect(),mx=center.x-r.left,my=center.y-r.top,wx=(mx-panX)/zoom,wy=(my-panY)/zoom;
      zoom=Math.min(MAX_ZOOM,Math.max(MIN_ZOOM,zoom*Math.pow(dist/lastPinchDist,.6)));panX=mx-wx*zoom;panY=my-wy*zoom;}
    if(lastPinchCenter){panX+=center.x-lastPinchCenter.x;panY+=center.y-lastPinchCenter.y;}
    lastPinchDist=dist;lastPinchCenter=center;updateTransform();},{passive:false});
  viewport.addEventListener('touchend',e=>{if(e.touches.length<2){lastPinchDist=null;lastPinchCenter=null;}});
  const undoStack=[];
  function saveUndo(){const s=[];world.querySelectorAll('.canvas-el').forEach(el=>s.push({id:el.id,left:el.style.left,top:el.style.top}));
    undoStack.push({panX,panY,zoom,assets:s});if(undoStack.length>60)undoStack.shift();}
  function undo(){if(!undoStack.length)return;const st=undoStack.pop();panX=st.panX;panY=st.panY;zoom=st.zoom;
    st.assets.forEach(a=>{const el=document.getElementById(a.id);if(el){el.style.left=a.left;el.style.top=a.top;}});updateTransform();}
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();}});
  function makeDraggable(el){let dragging=false,sx,sy,ox,oy;
    el.addEventListener('pointerdown',e=>{if(e.button!==0)return;dragging=true;el.classList.add('dragging');saveUndo();
      sx=e.clientX;sy=e.clientY;ox=parseFloat(el.style.left);oy=parseFloat(el.style.top);el.setPointerCapture(e.pointerId);e.stopPropagation();});
    el.addEventListener('pointermove',e=>{if(!dragging)return;el.style.left=(ox+(e.clientX-sx)/zoom)+'px';el.style.top=(oy+(e.clientY-sy)/zoom)+'px';});
    el.addEventListener('pointerup',()=>{if(dragging){dragging=false;el.classList.remove('dragging');}});}
  let _id=0;const uid=p=>(p||'el')+'-'+(++_id);

  function addSection(rowY,label){const parts=label.split(' '),num=parts[0]||'',rest=parts.slice(1).join(' ');
    const el=document.createElement('div');el.className='section-header';el.style.left='60px';el.style.top=rowY+'px';
    el.innerHTML=`<span class="section-line"></span><span class="section-num">${num}</span><span class="section-label">${rest}</span>`;
    world.appendChild(el);return rowY;}
  function addTitle(x,y,text,o={}){const el=document.createElement('div');el.className='canvas-title';el.id=uid('title');
    el.style.left=x+'px';el.style.top=y+'px';el.style.fontSize=(o.fontSize||48)+'px';
    if(o.fontWeight)el.style.fontWeight=o.fontWeight;if(o.color)el.style.color=o.color;if(o.maxWidth)el.style.maxWidth=o.maxWidth+'px';
    el.textContent=text;world.appendChild(el);return el;}
  function addText(x,y,text,o={}){const el=document.createElement('div');el.className='canvas-text canvas-el';el.id=uid('text');
    el.style.left=x+'px';el.style.top=y+'px';el.style.fontSize=(o.fontSize||14)+'px';
    if(o.color)el.style.color=o.color;if(o.maxWidth)el.style.maxWidth=o.maxWidth+'px';el.textContent=text;
    world.appendChild(el);makeDraggable(el);return el;}
  function addTag(x,y,label,o={}){const el=document.createElement('div');el.className='canvas-el';el.id=uid('tag');
    el.style.left=x+'px';el.style.top=y+'px';const c=o.color||'var(--accent)';
    el.innerHTML=`<div class="canvas-tag"><span class="tag-dot" style="background:${c}"></span>${label}</div>`;
    world.appendChild(el);makeDraggable(el);return el;}
  function addContextCard(x,y,w,h,title,content){const el=document.createElement('div');el.className='canvas-el';el.id=uid('ctx');
    el.style.left=x+'px';el.style.top=y+'px';el.style.width=w+'px';if(h)el.style.height=h+'px';
    el.innerHTML=`<div class="context-card" style="width:100%;${h?'height:100%':''}"><div class="card-head"><div class="head-indicator"></div><h3>${title}</h3></div><div class="card-content">${content}</div></div>`;
    world.appendChild(el);makeDraggable(el);return el;}
  function addDesignSystemCard(x,y,w,h,type,data){const el=document.createElement('div');el.className='canvas-el';el.id=uid('ds');
    el.style.left=x+'px';el.style.top=y+'px';el.style.width=w+'px';if(h)el.style.height=h+'px';
    let body='';
    if(type==='color'&&Array.isArray(data.colors)){body=`<div class="color-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:14px">${data.colors.map(c=>`<div class="color-chip" style="aspect-ratio:1;border-radius:8px;background:${c.hex};position:relative"><span style="position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary);white-space:nowrap">${c.name||c.hex}</span></div>`).join('')}</div>`;}
    else if(type==='typography'&&Array.isArray(data.samples)){body=`<div style="display:flex;flex-direction:column;gap:12px">${data.samples.map(s=>`<div style="display:flex;align-items:baseline;gap:16px"><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary);min-width:44px;text-transform:uppercase">${s.label}</span><span style="font-size:${s.size}px;font-weight:${s.weight||400};color:var(--text);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${s.font?'font-family:'+s.font:''}">${s.text||'Aa'}</span></div>`).join('')}</div>`;}
    else if(typeof data.html==='string'){body=data.html;}
    el.innerHTML=`<div class="ds-card" style="width:100%;${h?'height:100%':''}"><div class="ds-head">${data.title||type}</div><div class="ds-body">${body}</div></div>`;
    world.appendChild(el);makeDraggable(el);return el;}
  function addColorSwatch(x,y,colors){const el=document.createElement('div');el.className='canvas-el';el.id=uid('swatch');
    el.style.left=x+'px';el.style.top=y+'px';
    el.innerHTML=`<div class="color-swatch-group">${colors.map(c=>`<div class="swatch-item"><div class="swatch-circle" style="background:${c.hex}"></div><div class="swatch-name">${c.name||''}</div><div class="swatch-hex">${c.hex}</div></div>`).join('')}</div>`;
    world.appendChild(el);makeDraggable(el);return el;}
  function addTypeSample(x,y,samples){const el=document.createElement('div');el.className='canvas-el';el.id=uid('typesample');
    el.style.left=x+'px';el.style.top=y+'px';
    el.innerHTML=`<div class="type-sample-group" style="display:flex;flex-direction:column;gap:18px;min-width:380px">${samples.map(s=>`<div style="display:flex;align-items:baseline;gap:20px"><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary);min-width:52px">${s.label}<br>${s.size}px</span><span style="font-size:${s.size}px;font-weight:${s.weight||400};color:var(--text);line-height:1.25;${s.font?'font-family:'+s.font:''}">${s.text||'The quick brown fox'}</span></div>`).join('')}</div>`;
    world.appendChild(el);makeDraggable(el);return el;}
  let _pageNum=0;
  function addPage(x,y,w,h,label,htmlContent){_pageNum++;const el=document.createElement('div');el.className='canvas-el';el.id=uid('page');
    el.style.left=x+'px';el.style.top=y+'px';el.style.width=w+'px';el.style.height=(h+40)+'px';
    el.innerHTML=`<div class="design-page" style="width:${w}px;height:${h}px"><div class="page-content">${htmlContent}</div></div><div class="page-label"><span class="label-num">${String(_pageNum).padStart(2,'0')}</span>${label}</div>`;
    world.appendChild(el);makeDraggable(el);return el;}
  function addNote(x,y,tag,text){const el=document.createElement('div');el.className='canvas-el';el.id=uid('note');
    el.style.left=x+'px';el.style.top=y+'px';
    el.innerHTML=`<div class="canvas-note"><div class="note-tag">${tag}</div><div class="note-body">${text}</div></div>`;
    world.appendChild(el);makeDraggable(el);return el;}
  function addDiagram(x,y,w,h,htmlContent){const el=document.createElement('div');el.className='canvas-el';el.id=uid('diagram');
    el.style.left=x+'px';el.style.top=y+'px';el.style.width=w+'px';el.style.height=h+'px';
    el.innerHTML=`<div class="canvas-diagram" style="width:100%;height:100%"><div class="diagram-content">${htmlContent}</div></div>`;
    world.appendChild(el);makeDraggable(el);return el;}
  const below=(el,g=20)=>parseFloat(el.style.top)+el.offsetHeight+g;
  const rightOf=(el,g=20)=>parseFloat(el.style.left)+el.offsetWidth+g;
  const maxY=(els,g=20)=>Math.max(...els.map(e=>parseFloat(e.style.top)+e.offsetHeight))+g;
  window.canvas={addSection,addTitle,addText,addTag,addContextCard,addDesignSystemCard,addColorSwatch,addTypeSample,addPage,addNote,addDiagram,below,rightOf,maxY};

  /* ────────────────────────── ИКОНКИ ────────────────────────── */
  const I={
    mic:'<svg class="icn" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
    search:'<svg class="icn" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>',
    sort:'<svg class="icn" viewBox="0 0 24 24"><path d="M3 6h13M3 12h9M3 18h5"/><path d="M18 9v10M15 16l3 3 3-3"/></svg>',
    gear:'<svg class="icn" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
    play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
    plus:'<svg class="icn" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
    upload:'<svg class="icn" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>',
    doc:'<svg class="icn" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
    share:'<svg class="icn" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>',
    copy:'<svg class="icn" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
    tag:'<svg class="icn" viewBox="0 0 24 24"><path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>',
    clock:'<svg class="icn" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    text:'<svg class="icn" viewBox="0 0 24 24"><path d="M4 6h16M4 12h12M4 18h8"/></svg>',
    dialog:'<svg class="icn" viewBox="0 0 24 24"><path d="M4 5h16v10H9l-5 4z"/></svg>',
    gist:'<svg class="icn" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg>',
    edit:'<svg class="icn" viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="M13 5l4 4"/></svg>',
    trash:'<svg class="icn" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>',
    resume:'<svg class="icn" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 5v5h5"/></svg>',
    key:'<svg class="icn" viewBox="0 0 24 24"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3"/></svg>',
    wifi:'<svg class="icn" viewBox="0 0 24 24"><path d="M5 12a10 10 0 0 1 14 0M8 15a6 6 0 0 1 8 0"/><circle cx="12" cy="18" r="1"/></svg>',
    phone:'<svg class="icn" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M11 18h2"/></svg>'
  };
  const sc=(inner)=>`<div class="sc">${inner}</div>`;
  const hd=(brand,sub,right='')=>`<div class="hd"><div class="mark">${I.mic}</div><div class="brand">${brand}${sub?`<span>${sub}</span>`:''}</div><div class="r">${right}</div></div>`;

  /* ═════════════ ROW 1 · ПРОЕКТ ═════════════ */
  function row1(){
    addSection(40,'01 КОНТЕКСТ ПРОЕКТА');
    const t=addTitle(100,88,'ДиктаПро — полный редизайн',{fontSize:50,fontWeight:700,maxWidth:820});
    const d=addText(100,below(t,12),'Диктофон, который превращает речь в текст прямо на телефоне — без интернета и без отправки данных.\nЗадача этого холста: перенести ВСЮ функциональность приложения (5 месяцев работы) в новый визуальный язык — без потерь.',{fontSize:15,maxWidth:620});
    const ty=below(d,16);
    const g1=addTag(100,ty,'Полный экран-инвентарь');
    const g2=addTag(rightOf(g1,8),ty,'Офлайн · приватность');
    const g3=addTag(rightOf(g2,8),ty,'Android → потом iOS');
    const g4=addTag(rightOf(g3,8),ty,'18 экранов и состояний');
    const cy=below(g1,26);
    const c1=addContextCard(100,cy,320,null,'Для кого',
      '<ul><li>Диктует по работе: юристы, врачи, журналисты, аграрии</li><li>Студенты — лекции в конспект</li><li>Все, кому важны и текст, и приватность</li></ul>');
    const c2=addContextCard(440,cy,320,null,'Что решаем',
      '<ul><li>Запись и расшифровка не покидают телефон</li><li>Онлайн-функции — только по решению пользователя</li><li>Бесплатно: базовый режим; сверх — подписка и пакеты часов</li></ul>');
    const c3=addContextCard(780,cy,300,null,'Что меняем в дизайне',
      '<ul><li>Тихий «инструмент-ноутбук»: графит + мята</li><li>Красный — только главное действие</li><li>Цифры — моно, иконки — линейные</li></ul>');
    const ny=maxY([c1,c2,c3],26);
    const n1=addNote(100,ny,'Главное требование',
      'Ни одна функция не теряется: каждая из текущего приложения получает своё место. Импорт внешних файлов, таймер сна, термины, теги, экспорт, онлайн-режимы, кэш итогов, MIUI-настройки — всё нарисовано.');
    const n2=addNote(rightOf(n1,20),ny,'Порядок работы',
      'Сначала Android целиком (тема + все экраны + прогон), приёмка на телефоне, потом iOS. Не делаем две платформы одновременно.');
    const n3=addNote(rightOf(n2,20),ny,'Что за кадром',
      'Скриншоты для карточки магазина снимаем только после переезда — чтобы не переделывать дважды.');
    const n4=addNote(rightOf(n3,20),ny,'iOS — что отличается',
      'Дизайн тот же (Flutter, один код). Системное: выбор файлов — iOS Files; покупка — нативный StoreKit-шит (обязательна кнопка «Восстановить покупку»); «Поделиться» — системный share-sheet; safe area и свайп-назад; разрешения микрофона и фона; пуши — APNs.');
    return maxY([c1,c2,c3,n1,n2,n3,n4],90);
  }

  /* ═════════════ ROW 2 · ДИЗАЙН-СИСТЕМА ═════════════ */
  function row2(y){
    addSection(y,'02 ДИЗАЙН-СИСТЕМА');
    const dsY=y+58;
    const cs=addDesignSystemCard(100,dsY,520,null,'color',{title:'Палитра (токены)',colors:[
      {name:'bg0',hex:'#111A24'},{name:'bg1',hex:'#182532'},{name:'bg2',hex:'#1F2E3D'},
      {name:'surface',hex:'#2A3644'},{name:'line',hex:'#3A4757'},{name:'ink',hex:'#EAF2F5'},
      {name:'ink2',hex:'#9FAAB4'},{name:'mint',hex:'#8FE3D2'},{name:'mint2',hex:'#4FB3A5'},
      {name:'red',hex:'#FF6B6B'},{name:'gold',hex:'#FFD166'},{name:'light',hex:'#E6EDF2'}]});
