name: dictapro
description: DictaPro - voice recorder with AI transcription
publish_to: 'none'
version: 1.3.0+59

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  http: ^1.2.0
  flutter:
    sdk: flutter
  record: 5.1.0
  just_audio: 0.9.42
  hive: 2.2.3
  hive_flutter: 1.1.0
  path_provider: 2.1.5
  permission_handler: 10.4.5
  flutter_foreground_task: ^8.15.0
  intl: any
  sherpa_onnx: ^1.13.0
  share_plus: ^10.1.4
  file_picker: ^8.3.7
  pdf: ^3.10.7
  # Task 054: разовая покупка «Полная версия» (non-consumable).
  in_app_purchase: ^3.2.0
  # Task 056: локальное уведомление «Расшифровка готова».
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  hive_generator: 2.0.1
  build_runner: 2.4.13
  flutter_launcher_icons: 0.14.1

flutter:
  uses-material-design: true
  assets:
    # Модель GigaAM v3 — для ПРЯМОЙ РАЗДАЧИ (APK).
    # Перед APK-сборкой папку наполняет tools/prepare_apk_build.py
    # (копирует из install-time asset pack). Файлы .onnx/tokens.txt в gitignore —
    # в репозитории лежит только README.md, чтобы сборка не падала на пустой папке.
    # Для Play (AAB) модель идёт через android/gigaam_pack (см. android/app/build.gradle).
    - assets/models/gigaam_v3_punct/
    - assets/fonts/Roboto-Regular.ttf
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf

dependency_overrides:
  record_linux: ^1.3.1
y: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf

dependency_overrides:
  record_linux: ^1.3.1
