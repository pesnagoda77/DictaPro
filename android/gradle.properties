org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m
org.gradle.daemon=false
android.useAndroidX=true
android.enableJetifier=true
android.newDsl=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false

# Слабая машина/CI: Kotlin-демон не поднимается - компилируем в том же процессе
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
kotlin.incremental=false

# Слабая машина: отключаем слежение за файлами (Gradle падал на GlobalCacheLocations)
org.gradle.vfs.watch=false
org.gradle.parallel=false
org.gradle.configureondemand=false

org.gradle.logging.stacktrace=ALL
